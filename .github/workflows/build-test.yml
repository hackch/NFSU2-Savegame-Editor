name: Build and test editor

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package editor
        run: |
          cd dist
          zip -r ../nfsu2-savegame-editor-build.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: nfsu2-savegame-editor-build
          path: nfsu2-savegame-editor-build.zip
          if-no-files-found: error
          retention-days: 14
